<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#86efac" />
    <title>METIS — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0a;color:#f3f3ef;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);border:1px solid #27302c;background:#0d110f;padding:32px}.mark{width:54px;height:54px;object-fit:contain;margin-bottom:28px}.eyebrow{font:600 10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#86efac}.title{font-family:Georgia,serif;font-size:40px;font-weight:400;line-height:1.05;margin:12px 0}.copy{color:#9da49f;font-size:14px;line-height:1.65;margin:0 0 24px}.button{display:block;width:100%;border:0;background:#86efac;color:#07100b;font-weight:700;padding:14px;text-align:center;text-decoration:none}.note{display:flex;gap:8px;align-items:center;margin-top:18px;color:#778079;font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}.dot{width:7px;height:7px;border-radius:50%;background:#fbbf24}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/icons/metis-192.png" alt="METIS" />
      <div class="eyebrow">Offline mode</div>
      <h1 class="title">You’re still covered.</h1>
      <p class="copy">The network is unavailable. Previously saved ASHA registry records remain on this device. Reconnect to load a page that has not been opened before.</p>
      <a class="button" href="/asha">Open METIS Field</a>
      <div class="note"><span class="dot"></span> Changes will sync when connectivity returns</div>
    </main>
  </body>
</html>
